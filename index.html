<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Robô Branco PRO</title>

<style>
body{
    margin:0;
    background:#020617;
    color:#fff;
    font-family:Arial;
    overflow:auto;
    min-height:200vh;
}

/* 🔥 FUNDO */
#bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
    pointer-events:none;
}

.top, #historico, .grid, #historicoSinais{
    position:relative;
    z-index:2;
}

.top{
    text-align:center;
    padding:20px;
}

.titulo{
    font-size:50px;
    font-weight:bold;
    color:#00ffcc;
    text-shadow:0 0 10px #00ffcc, 0 0 40px #00ffcc;
}

#hora{
    font-size:28px;
    margin-top:10px;
}

.msg{
    margin-top:10px;
    color:#ccc;
}

.neon{
    font-size:32px;
    color:#00ffcc;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{ text-shadow:0 0 5px #00ffcc; }
    50%{ text-shadow:0 0 20px #00ffcc; }
    100%{ text-shadow:0 0 5px #00ffcc; }
}

#historico{
    display:flex;
    overflow-x:auto;
    padding:10px;
    gap:10px;
}

.item{
    width:50px;
    height:50px;
    min-width:50px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex-shrink:0;
}

.red{background:#ff0033;}
.black{background:#111;color:#fff;}
.white{background:#fff;color:#000;}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:20px;
}

button{
    height:70px;
    font-size:22px;
    border:none;
    border-radius:10px;
}

#resetPlacar{
    margin-top:10px;
    padding:10px;
    background:#ff0033;
    color:#fff;
}

#historicoSinais{
    padding:10px 20px;
    font-size:18px;
    color:#00ffcc;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="top">
    <div class="titulo">⚪ ROBÔ BRANCO PRO</div>
    <div id="hora"></div>
    <div id="res"></div>
    <button id="resetPlacar">🔄 Resetar Placar</button>
</div>

<div id="historico"></div>
<div id="historicoSinais"></div>
<div class="grid" id="botoes"></div>

<script>

/* ===== LÓGICA ORIGINAL ===== */
let historico=[];
let pedraA=null;
let pedraB=null;
let minutoAtual=null;

let previsoes=[];
let verificando=false;
let sinalGerado=false;

let greens=0;
let losses=0;

let historicoSinais=[];
let sinalAtualIndex=null;

const grid=document.getElementById("botoes");

for(let i=0;i<=14;i++){
    let btn=document.createElement("button");
    btn.innerText=i;

    if(i===0)btn.className="white";
    else if(i<=7)btn.className="red";
    else btn.className="black";

    btn.onclick=()=>clicar(i);
    grid.appendChild(btn);
}

function getHoraBR(){
    let d=new Date();
    let br=new Date(d.toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));
    return {h:br.getHours(),m:br.getMinutes(),s:br.getSeconds()};
}

function clicar(num){

    let t=getHoraBR();
    let s=t.s;

    historico.push(num);
    if(historico.length>100)historico.shift();
    renderHistorico();

    if(t.m%10!==9 || sinalGerado){
        verificarResultado(num);
        return;
    }

    if(minutoAtual!==t.m){
        minutoAtual=t.m;
        pedraA=null;
        pedraB=null;
        sinalGerado=false;
    }

    let pedra1ok = (s>=15 && s<=45);
    let pedra2ok = (s>=45 || s<=15);

    if(!pedraA && pedra1ok && num!==0){
        pedraA=num;
        document.getElementById("res").innerHTML="<div class='msg'>🧠 Analisando...</div>";
        return;
    }

    if(pedraA && !pedraB && pedra2ok && num!==0){
        pedraB=num;
        calcular(t.h,t.m);
        sinalGerado=true;
    }

    verificarResultado(num);
}

function renderHistorico(){
    let h=document.getElementById("historico");
    let n=historico[historico.length-1];

    let d=document.createElement("div");
    d.className="item "+getCor(n);
    d.innerText=n;

    h.appendChild(d);
    h.scrollLeft=h.scrollWidth;

    if(h.children.length>100){
        h.removeChild(h.firstChild);
    }
}

function getCor(n){
    if(n===0)return"white";
    if(n<=7)return"red";
    return"black";
}

function renderHistoricoSinais(){
    let el=document.getElementById("historicoSinais");
    let html="";

    for(let i=historicoSinais.length-1;i>=0;i-=2){
        let s1=historicoSinais[i];
        let s2=historicoSinais[i-1];

        html+=`
        <div style="display:flex; justify-content:space-between;">
            <span>${s1 ? s1.hora + s1.status : ""}</span>
            <span>${s2 ? s2.hora + s2.status : ""}</span>
        </div>`;
    }

    el.innerHTML=html;
}

setInterval(()=>{
    let t=getHoraBR();
    document.getElementById("hora").innerText=
    `${String(t.h).padStart(2,"0")}:${String(t.m).padStart(2,"0")}:${String(t.s).padStart(2,"0")}`;
},1000);

/* resto do código continua exatamente igual */


/* =====================================
   🔥 SOMENTE EFEITO NO FUNDO
===================================== */

const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resizeBg(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeBg();
window.addEventListener("resize", resizeBg);

let particulas = [];

for(let i=0;i<80;i++){
    particulas.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*3+1,
        dx:(Math.random()-0.5)*0.6,
        dy:(Math.random()-0.5)*0.6
    });
}

function animarBg(){

    ctx.fillStyle="rgba(2,6,23,0.18)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    particulas.forEach(p=>{

        p.x += p.dx;
        p.y += p.dy;

        if(p.x<0 || p.x>canvas.width) p.dx*=-1;
        if(p.y<0 || p.y>canvas.height) p.dy*=-1;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle="#00ffcc";
        ctx.shadowBlur=15;
        ctx.shadowColor="#00ffcc";
        ctx.fill();
    });

    requestAnimationFrame(animarBg);
}

animarBg();

</script>

</body>
</html>
