<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robô Branco PRO</title>

<style>
body{margin:0;background:#020617;color:#fff;font-family:Arial;overflow:auto;min-height:200vh;}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
.top,#historico,.grid,#historicoSinais{position:relative;z-index:2;}
.top{text-align:center;padding:20px;}
.titulo{font-size:50px;font-weight:bold;color:#00ffcc;text-shadow:0 0 10px #00ffcc,0 0 40px #00ffcc;}
#hora{font-size:28px;margin-top:10px;}
.msg{margin-top:10px;color:#ccc;}
.neon{font-size:32px;color:#00ffcc;animation:pulse 1s infinite;}
@keyframes pulse{0%{text-shadow:0 0 5px #00ffcc;}50%{text-shadow:0 0 20px #00ffcc;}100%{text-shadow:0 0 5px #00ffcc;}}
#historico{display:flex;overflow-x:auto;padding:10px;gap:10px;}
.item{width:50px;height:50px;min-width:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;}
.red{background:#ff0033;}
.black{background:#111;}
.white{background:#fff;color:#000;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px;}
button{height:70px;font-size:22px;font-weight:900;border:none;border-radius:10px;}
#resetPlacar{margin-top:10px;padding:10px;background:#ff0033;color:#fff;}
#historicoSinais{padding:10px 20px;font-size:18px;color:#00ffcc;}
#statusAPI{margin-top:10px;font-size:14px;color:#00ffcc;}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="top">
<div class="titulo">⚪ ROBÔ BRANCO PRO</div>
<div id="hora"></div>
<div id="res"></div>
<div id="statusAPI">🔌 Conectando API...</div>
<button id="resetPlacar">🔄 Resetar</button>
</div>

<div id="historico"></div>
<div id="historicoSinais"></div>
<div class="grid" id="botoes"></div>

<script>

let historico=[],pedraA=null,pedraB=null;
let minutoPedra1=null;
let previsoes=[],verificando=false;
let historicoSinais=[],sinalAtualIndex=null;
let cicloAtivo=false;

const grid=document.getElementById("botoes");

for(let i=0;i<=14;i++){
    let btn=document.createElement("button");
    btn.innerText=i;
    btn.className=(i===0?"white":i<=7?"red":"black");
    btn.onclick=()=>clicar(i);
    grid.appendChild(btn);
}

function getHoraBR(){
    let d=new Date();
    let br=new Date(d.toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));
    return {h:br.getHours(),m:br.getMinutes(),s:br.getSeconds()};
}

function clicar(num){
    let t=getHoraBR();

    historico.push(num);
    if(historico.length>100) historico.shift();
    renderHistorico();

    if(num===0){verificarResultado(num);return;}

    let pedra1ok=(t.m%10===9)&&(t.s>=15&&t.s<=45);

    let pedra2ok=
    (t.m===minutoPedra1 && t.s>=45 && t.s<=59) ||
    (t.m===(minutoPedra1+1)%60 && t.s>=0 && t.s<=15);

    if(!cicloAtivo && pedra1ok){
        pedraA=num;
        minutoPedra1=t.m;
        cicloAtivo=true;
        return;
    }

    if(cicloAtivo && pedraB===null && pedra2ok){
        pedraB=num;
        calcular(t.h,t.m);
        cicloAtivo=false;
    }

    verificarResultado(num);
}

function renderHistorico(){
    let h=document.getElementById("historico");
    let n=historico[historico.length-1];

    let d=document.createElement("div");
    d.className="item "+(n===0?"white":n<=7?"red":"black");
    d.innerText=n;

    h.appendChild(d);
    h.scrollLeft=h.scrollWidth;
}

function calcular(hora,minuto){
    let base=minuto;
    if(minuto%10===9) base=minuto+1;
    if(base===60){base=0;hora++;}

    function f(h,m){
        if(m>=60){h+=Math.floor(m/60);m%=60;}
        if(h>=24)h%=24;
        return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
    }

    let s1 = pedraA ? f(hora, base + pedraA) : null;
    let s2 = pedraB ? f(hora, base + pedraB) : null;

    previsoes=[s1,s2].filter(Boolean);
    if(previsoes.length===0){verificando=false;return;}

    verificando=true;

    historicoSinais.push({
        horarios:previsoes.map(h=>({hora:h,status:"⏳"}))
    });

    sinalAtualIndex=historicoSinais.length-1;
    renderHistoricoSinais();

    document.getElementById("res").innerHTML=
    `<div class="neon">⚪ ENTRAR NO BRANCO</div>
    ${previsoes.map(p=>`<div>${p}</div>`).join("")}`;
}

function renderHistoricoSinais(){
    let el=document.getElementById("historicoSinais");
    let html="<div class='msg'>📜 Histórico</div>";

    for(let i=historicoSinais.length-1;i>=0;i--){
        historicoSinais[i].horarios.forEach(h=>{
            html+=`<div>${h.hora} ${h.status}</div>`;
        });
        html+=`<div style="height:10px"></div>`;
    }

    el.innerHTML=html;
}

function verificarResultado(num){
    if(!verificando)return;

    let t=getHoraBR();
    let agora=new Date();
    agora.setHours(t.h,t.m,t.s);

    previsoes.forEach((p,i)=>{
        let [h,m]=p.split(":").map(Number);
        let inicio=new Date();inicio.setHours(h,m-1,0);
        let fim=new Date();fim.setHours(h,m+1,59);

        if(num===0 && agora>=inicio && agora<=fim){
            historicoSinais[sinalAtualIndex].horarios[i].status="✅";
        }
    });

    renderHistoricoSinais();
}

/* API BACKEND CORRIGIDA */
let ultimoId=null;

async function pegarResultados(){
    try{
        let res=await fetch("http://localhost:3000/blaze");

        if(!res.ok){
            document.getElementById("statusAPI").innerText="🔴 API Offline";
            return;
        }

        let data=await res.json();

        document.getElementById("statusAPI").innerText="🟢 API Conectada";

        if(!data || data.length === 0){
            return;
        }

        let ultimo=data[0];

        if(ultimoId===ultimo.id) return;

        ultimoId=ultimo.id;

        clicar(ultimo.roll);

    }catch(e){
        document.getElementById("statusAPI").innerText="🔴 API Offline";
    }
}

setInterval(pegarResultados,3000);

/* RELÓGIO */
setInterval(()=>{
    let t=getHoraBR();
    document.getElementById("hora").innerText=
    `${String(t.h).padStart(2,"0")}:${String(t.m).padStart(2,"0")}:${String(t.s).padStart(2,"0")}`;
},1000);

</script>
</body>
</html>
