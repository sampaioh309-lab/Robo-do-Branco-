<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Robô Branco PRO</title>

<style>
body{
    margin:0;
    background:#020617;
    color:#fff;
    font-family:Arial;
    overflow:auto;
    min-height:200vh;
}

#bg{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
}

.top,#historico,.grid,#historicoSinais{
    position:relative;
    z-index:2;
}

.top{
    text-align:center;
    padding:20px;
}

.titulo{
    font-size:50px;
    font-weight:bold;
    color:#00ffcc;
    text-shadow:0 0 10px #00ffcc,0 0 40px #00ffcc;
}

#hora{
    font-size:28px;
    margin-top:10px;
}

.msg{
    margin-top:10px;
    color:#ccc;
}

.neon{
    font-size:32px;
    color:#00ffcc;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{text-shadow:0 0 5px #00ffcc;}
    50%{text-shadow:0 0 20px #00ffcc;}
    100%{text-shadow:0 0 5px #00ffcc;}
}

#historico{
    display:flex;
    overflow-x:auto;
    padding:10px;
    gap:10px;
}

.item{
    width:50px;
    height:50px;
    min-width:50px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex-shrink:0;
}

.red{background:#ff0033;}
.black{background:#111;color:#fff;}
.white{background:#fff;color:#000;}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:20px;
}

button{
    height:70px;
    font-size:22px;
    border:none;
    border-radius:10px;
}

#resetPlacar{
    margin-top:10px;
    padding:10px;
    background:#ff0033;
    color:#fff;
}

#historicoSinais{
    padding:10px 20px;
    font-size:18px;
    color:#00ffcc;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="top">
    <div class="titulo">⚪ ROBÔ BRANCO PRO</div>
    <div id="hora"></div>
    <div id="res"></div>
    <button id="resetPlacar">🔄 Resetar Placar</button>
</div>

<div id="historico"></div>
<div id="historicoSinais"></div>
<div class="grid" id="botoes"></div>

<script>

let historico=[];
let pedraA=null;
let pedraB=null;

let previsoes=[];
let verificando=false;
let sinalGerado=false;
let cicloAtivo=false;

let greens=0;
let losses=0;

let historicoSinais=[];
let sinalAtualIndex=null;

const grid=document.getElementById("botoes");

/* BOTÕES */
for(let i=0;i<=14;i++){
    let btn=document.createElement("button");
    btn.innerText=i;

    if(i===0) btn.className="white";
    else if(i<=7) btn.className="red";
    else btn.className="black";

    btn.onclick=()=>clicar(i);
    grid.appendChild(btn);
}

function getHoraBR(){
    let d=new Date();
    let br=new Date(d.toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));
    return {
        h:br.getHours(),
        m:br.getMinutes(),
        s:br.getSeconds()
    };
}

function clicar(num){

    let t=getHoraBR();
    let s=t.s;

    historico.push(num);
    if(historico.length>100) historico.shift();
    renderHistorico();

    if(num===0){
        verificarResultado(num);
        return;
    }

    let pedra1ok = (s >= 15 && s < 45);
    let pedra2ok = (s >= 45 && s <= 59) || (s >= 0 && s <= 15);

    if(t.m % 10 !== 9 && !cicloAtivo){
        verificarResultado(num);
        return;
    }

    if(!cicloAtivo && pedra1ok){
        pedraA = num;
        cicloAtivo = true;

        document.getElementById("res").innerHTML = `
        <div class="msg">🧠 Pedra 1 (${num})</div>`;
        return;
    }

    if(cicloAtivo && pedraA !== null && pedraB === null && pedra2ok){
        pedraB = num;

        document.getElementById("res").innerHTML = `
        <div class="msg">🧠 Pedra 2 (${num})</div>`;

        calcular(t.h,t.m);
        sinalGerado = true;
        cicloAtivo = false;
    }

    verificarResultado(num);
}

function renderHistorico(){
    let h=document.getElementById("historico");
    let n=historico[historico.length-1];

    let d=document.createElement("div");
    d.className="item "+getCor(n);
    d.innerText=n;

    h.appendChild(d);
    h.scrollLeft=h.scrollWidth;

    if(h.children.length>100){
        h.removeChild(h.firstChild);
    }
}

function getCor(n){
    if(n===0)return"white";
    if(n<=7)return"red";
    return"black";
}

function renderHistoricoSinais(){

    let el=document.getElementById("historicoSinais");
    let html="<div class='msg'>📜 Histórico de sinais</div>";

    for(let i=historicoSinais.length-1;i>=0;i--){
        html+=`
        <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08)">
            <span>${historicoSinais[i].hora}</span>
            <span>${historicoSinais[i].status}</span>
        </div>`;
    }

    el.innerHTML=html;
}

/* RELÓGIO */
setInterval(()=>{
    let t=getHoraBR();
    document.getElementById("hora").innerText=
    `${String(t.h).padStart(2,"0")}:${String(t.m).padStart(2,"0")}:${String(t.s).padStart(2,"0")}`;
},1000);

/* CALCULAR */
function calcular(hora,minuto){

    let base=Math.ceil(minuto/10)*10;

    if(base===60){
        base=0;
        hora++;
    }

    function f(h,m){
        if(m>=60){
            h+=Math.floor(m/60);
            m%=60;
        }
        if(h>=24) h%=24;

        return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
    }

    let s1=f(hora,base+pedraA);
    let s2=f(hora,base+pedraB);

    previsoes=[s1,s2];
    verificando=true;

    historicoSinais.push({
        hora:`${s1} / ${s2}`,
        status:"⏳ AGUARDANDO"
    });

    sinalAtualIndex=historicoSinais.length-1;
    renderHistoricoSinais();

    document.getElementById("res").innerHTML=`
    <div class="msg">🚨 SINAL IDENTIFICADO</div>
    <div class="neon">⚪ ENTRAR NO BRANCO</div>
    <div class="msg">⏰ ${s1}</div>
    <div class="msg">⏰ ${s2}</div>
    <div class="msg">📊 🟢 ${greens} | 🔴 ${losses}</div>`;
}

/* 🔥 AQUI FOI A MUDANÇA QUE VOCÊ PEDIU */
function verificarResultado(num){

    if(!verificando) return;

    let t=getHoraBR();

    function toDate(h,m){
        let d=new Date();
        d.setHours(h);
        d.setMinutes(m);
        d.setSeconds(0);
        return d;
    }

    let agora=new Date();
    agora.setHours(t.h);
    agora.setMinutes(t.m);
    agora.setSeconds(t.s);

    let dentro=false;

    previsoes.forEach(p=>{
        let [h,m]=p.split(":").map(Number);

        let inicio=toDate(h,m-1);
        let fim=toDate(h,m+1);

        if(agora>=inicio && agora<=fim){
            dentro=true;
        }
    });

    if(num===0){

        if(dentro){
            greens++;
            historicoSinais[sinalAtualIndex].status="🟢 GREEN";
        }else{
            losses++;
            historicoSinais[sinalAtualIndex].status="🔴 LOSS (fora da janela)";
        }

        renderHistoricoSinais();

        pedraA=null;
        pedraB=null;
        sinalGerado=false;
        verificando=false;

        document.getElementById("res").innerHTML+=`
        <div class="neon" style="font-size:50px;color:${dentro?'#00ff00':'#ff0033'}">
        ${dentro?'🟢 GREEN':'🔴 LOSS'}
        </div>`;

        return;
    }

    let [h2,m2]=previsoes[1].split(":").map(Number);
    let limite=toDate(h2,m2+1);

    if(agora>limite){

        losses++;
        verificando=false;

        historicoSinais[sinalAtualIndex].status="🔴 LOSS";
        renderHistoricoSinais();

        pedraA=null;
        pedraB=null;
        sinalGerado=false;

        document.getElementById("res").innerHTML+=`
        <div class="neon" style="font-size:50px;color:#ff0033">🔴 LOSS</div>`;
    }
}

document.getElementById("resetPlacar").onclick=()=>{
    greens=0;
    losses=0;
    document.getElementById("res").innerHTML="Placar resetado";
};

/* FUNDO */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let bolas=[];
let textos=[];

function criarBola(){
    bolas.push({
        x:Math.random()*canvas.width,
        y:-20,
        size:Math.random()*12+6,
        speed:Math.random()*0.7+0.3,
        alpha:Math.random()*0.4+0.2
    });
}

function criarTexto(){
    textos.push({
        x:Math.random()*canvas.width*0.7+50,
        y:-40,
        size:24,
        speed:0.35,
        alpha:0.2,
        text:"GREENS BRANCO 🤑"
    });
}

function animar(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(Math.random()<0.25) criarBola();
    if(Math.random()<0.02) criarTexto();

    bolas.forEach((b,i)=>{
        ctx.globalAlpha=b.alpha;
        ctx.beginPath();
        ctx.arc(b.x,b.y,b.size,0,Math.PI*2);
        ctx.fillStyle="#fff";
        ctx.fill();
        b.y+=b.speed;

        if(b.y>canvas.height) bolas.splice(i,1);
    });

    textos.forEach((t,i)=>{
        ctx.globalAlpha=t.alpha;
        ctx.font="600 "+t.size+"px Arial";
        ctx.fillStyle="#fff";
        ctx.fillText(t.text,t.x,t.y);
        t.y+=t.speed;

        if(t.y>canvas.height) textos.splice(i,1);
    });

    ctx.globalAlpha=1;
    requestAnimationFrame(animar);
}

animar();

</script>
</body>
    </html>
