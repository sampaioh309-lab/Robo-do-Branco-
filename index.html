<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Robô Branco PRO</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffcc">
<link rel="icon" href="icon-192.png">

<style>
body{
    margin:0;
    background:#020617;
    color:#fff;
    font-family:Arial;
    overflow:auto;
    min-height:200vh;
}

#bg{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
}

.top,#historico,.grid,#historicoSinais{
    position:relative;
    z-index:2;
}

.top{
    text-align:center;
    padding:20px;
}

.titulo{
    font-size:50px;
    font-weight:bold;
    color:#00ffcc;
    text-shadow:0 0 10px #00ffcc,0 0 40px #00ffcc;
}

#hora{
    font-size:28px;
    margin-top:10px;
}

.msg{
    margin-top:10px;
    color:#ccc;
}

.neon{
    font-size:32px;
    color:#00ffcc;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{text-shadow:0 0 5px #00ffcc;}
    50%{text-shadow:0 0 20px #00ffcc;}
    100%{text-shadow:0 0 5px #00ffcc;}
}

#historico{
    display:flex;
    overflow-x:auto;
    padding:10px;
    gap:10px;
}

.item{
    width:50px;
    height:50px;
    min-width:50px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex-shrink:0;
}

/* 🔥 BOTÕES CORRIGIDOS */
.red{
    background:#ff0033;
    color:#fff;
    font-weight:900;
}

.black{
    background:#111;
    color:#fff;
    font-weight:900;
}

.white{
    background:#fff;
    color:#000;
    font-weight:900;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:20px;
}

button{
    height:70px;
    font-size:22px;
    font-weight:900;
    border:none;
    border-radius:10px;
}

#resetPlacar{
    margin-top:10px;
    padding:10px;
    background:#ff0033;
    color:#fff;
}

#instalarApp{
    margin-top:10px;
    padding:10px;
    background:#00ffcc;
    color:#000;
    display:none;
}

#historicoSinais{
    padding:10px 20px;
    font-size:18px;
    color:#00ffcc;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="top">
    <div class="titulo">⚪ ROBÔ BRANCO PRO</div>
    <div id="hora"></div>
    <div id="res"></div>

    <button id="resetPlacar">🔄 Resetar Placar</button>
    <button id="instalarApp">📲 Instalar App</button>
</div>

<div id="historico"></div>
<div id="historicoSinais"></div>
<div class="grid" id="botoes"></div>

<script>

/* PWA */
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}

/* Notificação */
if ("Notification" in window) {
    Notification.requestPermission();
}

function notificar(msg){
    if(Notification.permission==="granted"){
        new Notification("⚪ ROBÔ BRANCO", { body: msg });
    }
}

/* Instalar App */
let deferredPrompt;

window.addEventListener("beforeinstallprompt",(e)=>{
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("instalarApp").style.display="block";
});

document.getElementById("instalarApp").onclick = async ()=>{
    if(deferredPrompt){
        deferredPrompt.prompt();
        deferredPrompt=null;
    }
};

/* LÓGICA ORIGINAL */
let historico=[];
let pedraA=null;
let pedraB=null;
let previsoes=[];
let verificando=false;
let cicloAtivo=false;

let greens=0;
let losses=0;

let historicoSinais=[];
let sinalAtualIndex=null;

const grid=document.getElementById("botoes");

/* BOTÕES */
for(let i=0;i<=14;i++){
    let btn=document.createElement("button");
    btn.innerText=i;

    if(i===0) btn.className="white";
    else if(i<=7) btn.className="red";
    else btn.className="black";

    btn.onclick=()=>clicar(i);
    grid.appendChild(btn);
}

function getHoraBR(){
    let d=new Date();
    let br=new Date(d.toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));
    return {
        h:br.getHours(),
        m:br.getMinutes(),
        s:br.getSeconds()
    };
}

function clicar(num){

    let t=getHoraBR();

    historico.push(num);
    if(historico.length>100) historico.shift();
    renderHistorico();

    if(num===0){
        verificarResultado(num);
        return;
    }

    let pedra1ok = (t.s >= 15 && t.s < 45);
    let pedra2ok = (t.s >= 45 || t.s <= 15);

    if(!cicloAtivo && pedra1ok){
        pedraA = num;
        cicloAtivo = true;
        return;
    }

    if(cicloAtivo && pedraB === null && pedra2ok){
        pedraB = num;
        calcular(t.h,t.m);
        cicloAtivo = false;
    }

    verificarResultado(num);
}

function renderHistorico(){
    let h=document.getElementById("historico");
    let n=historico[historico.length-1];

    let d=document.createElement("div");
    d.className="item "+(n===0?"white":n<=7?"red":"black");
    d.innerText=n;

    h.appendChild(d);
    h.scrollLeft=h.scrollWidth;

    if(h.children.length>100){
        h.removeChild(h.firstChild);
    }
}

/* CALCULAR + ALERTA */
function calcular(hora,minuto){

    let base=Math.ceil(minuto/10)*10;

    if(base===60){
        base=0;
        hora++;
    }

    function f(h,m){
        if(m>=60){
            h+=Math.floor(m/60);
            m%=60;
        }
        if(h>=24) h%=24;

        return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
    }

    let s1=f(hora,base+pedraA);
    let s2=f(hora,base+pedraB);

    previsoes=[s1,s2];
    verificando=true;

    /* 🔔 ALERTA 2 MINUTOS */
    previsoes.forEach(p=>{
        let [h,m]=p.split(":").map(Number);

        let alerta=new Date();
        alerta.setHours(h);
        alerta.setMinutes(m-2);
        alerta.setSeconds(0);

        let tempo=alerta.getTime()-Date.now();

        if(tempo>0){
            setTimeout(()=>{
                notificar(`Faltam 2 minutos para o branco ${p}`);
            },tempo);
        }
    });

    document.getElementById("res").innerHTML=`
    <div class="msg">🚨 SINAL IDENTIFICADO</div>
    <div class="neon">⚪ ENTRAR NO BRANCO</div>
    <div class="msg">⏰ ${s1}</div>
    <div class="msg">⏰ ${s2}</div>
    <div class="msg">📊 🟢 ${greens} | 🔴 ${losses}</div>`;
}

function verificarResultado(num){

    if(!verificando) return;

    if(num===0){
        greens++;
        verificando=false;

        document.getElementById("res").innerHTML+=`
        <div class="neon" style="color:#00ff00">🟢 GREEN</div>`;
    }
}

/* RESET */
document.getElementById("resetPlacar").onclick=()=>{
    greens=0;
    losses=0;
    document.getElementById("res").innerHTML="Placar resetado";
};

/* 🔥 FUNDO ANIMADO (MANTIDO) */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let bolas=[];

function criarBola(){
    bolas.push({
        x:Math.random()*canvas.width,
        y:-20,
        size:Math.random()*12+6,
        speed:Math.random()*0.7+0.3,
        alpha:Math.random()*0.4+0.2
    });
}

function animar(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(Math.random()<0.25) criarBola();

    bolas.forEach((b,i)=>{
        ctx.globalAlpha=b.alpha;
        ctx.beginPath();
        ctx.arc(b.x,b.y,b.size,0,Math.PI*2);
        ctx.fillStyle="#fff";
        ctx.fill();
        b.y+=b.speed;

        if(b.y>canvas.height) bolas.splice(i,1);
    });

    ctx.globalAlpha=1;
    requestAnimationFrame(animar);
}

animar();

</script>
</body>
    </html>
