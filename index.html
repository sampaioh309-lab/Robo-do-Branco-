<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Hunter Branco Manual PRO</title>

<style>
body { background:#020617; color:#fff; font-family:Arial; text-align:center; }
.container { max-width:900px; margin:auto; }

.btn {
    font-size:30px; padding:15px; margin:5px;
    border:none; border-radius:10px; cursor:pointer;
}

.vermelho { background:#ef4444; }
.preto { background:#111; color:#fff; }
.branco { background:#fff; color:#000; }

.numero-btn { padding:10px; margin:5px; border-radius:8px; border:none; cursor:pointer; }

.card { background:#0f172a; margin:10px; padding:15px; border-radius:10px; }

.sinal { background:#1e293b; margin:5px; padding:10px; border-radius:8px; }

.win { color:#22c55e; }
.loss { color:#ef4444; }

.relogio { font-size:20px; font-weight:bold; color:#38bdf8; margin-top:10px; }

#historico {
    display:flex;
    justify-content:flex-start;
    flex-wrap:nowrap;
    overflow:hidden;
}

.bolinha {
    width:32px; height:32px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    font-weight:bold; margin:3px; font-size:14px;
}

.b-vermelho { background:#ef4444; color:#fff; }
.b-preto { background:#111; color:#fff; }
.b-branco { background:#fff; color:#000; box-shadow:0 0 6px #fff; }

.modal {
    position:fixed; top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.8);
    display:none; justify-content:center; align-items:center;
}

.modal-content { background:#0f172a; padding:20px; border-radius:10px; }

#resultadoTela {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    font-size:80px;
    font-weight:bold;
    z-index:9999;
}

.green { color:#22c55e; }
.red { color:#ef4444; }
</style>
</head>

<body>

<div class="container">

<h1>🤖 HUNTER BRANCO MANUAL PRO</h1>
<div class="relogio" id="relogio">--:--:--</div>

<div class="card">
    <h2>Registrar Jogada</h2>
    <button class="btn vermelho" onclick="abrirNumeros(1)">🔴</button>
    <button class="btn preto" onclick="abrirNumeros(2)">⚫</button>
    <button class="btn branco" onclick="add(0,0)">⚪</button>
</div>

<div class="card">
    <h2>Histórico</h2>
    <div id="historico"></div>
</div>

<div class="card">
    <h2>Sinais</h2>
    <div id="sinais"></div>
</div>

<div class="card">
    <h2>Estatísticas</h2>
    <div>Wins: <span id="wins">0</span></div>
    <div>Loss: <span id="loss">0</span></div>
    <div>Assertividade: <span id="assert">0%</span></div>
</div>

</div>

<div id="modal" class="modal">
    <div class="modal-content" id="numeros"></div>
</div>

<div id="resultadoTela"></div>

<script>
let historico = [];
let sinais = [];
let bufferSinais = [];

let wins = 0;
let loss = 0;

// NOTIFICAÇÃO
if (Notification.permission !== "granted") {
    Notification.requestPermission();
}

function notificar(msg) {
    if (Notification.permission === "granted") {
        new Notification("🤖 Hunter Branco", { body: msg });
    }
}

// RELÓGIO
function atualizarRelogio() {
    const horaBR = new Date().toLocaleTimeString("pt-BR",{timeZone:"America/Sao_Paulo"});
    document.getElementById("relogio").innerText = horaBR;
}
setInterval(atualizarRelogio,1000);
atualizarRelogio();

// REGRA
function podeGerarSinal() {
    let d = new Date(), m = d.getMinutes(), s = d.getSeconds();
    return (m % 10 === 9 && s >= 30) || (m % 10 === 0 && s <= 5);
}

// 🔥 IDENTIFICAR PEDRA 2
function ehPedra2(data){
    const s = data.getSeconds();
    return (s >= 45 || s <= 14);
}

// ABRIR NÚMEROS
function abrirNumeros(cor) {
    let html = "<h3>Escolha o número</h3>";
    let inicio = cor === 1 ? 1 : 8;
    let fim = cor === 1 ? 7 : 14;

    for (let i = inicio; i <= fim; i++) {
        html += `<button class="numero-btn" onclick="add(${cor}, ${i})">${i}</button>`;
    }

    document.getElementById("numeros").innerHTML = html;
    document.getElementById("modal").style.display = "flex";
}

// ADD (🔥 ALTERAÇÃO AQUI)
function add(cor, numero) {

    document.getElementById("modal").style.display = "none";

    const agoraReal = new Date();

    historico.push({ cor, numero, hora: agoraReal });

    if (historico.length > 100) historico.shift();

    if (cor !== 0 && podeGerarSinal()) {

        const baseRef = historico[historico.length - 1].hora;
        const base = new Date(baseRef);

        base.setSeconds(0);
        base.setMilliseconds(0);

        base.setMinutes(base.getMinutes() + 1);

        const alvo = new Date(base.getTime() + numero * 60000);

        // 🔥 REGRA: se for pedra 2 → tira 1 minuto
        if(ehPedra2(baseRef)){
            alvo.setMinutes(alvo.getMinutes() - 1);
        }

        const hora = alvo.toLocaleTimeString("pt-BR",{hour:'2-digit',minute:'2-digit'});

        bufferSinais.push({hora});

        if (bufferSinais.length === 2) {
            sinais.push([...bufferSinais]);
            bufferSinais = [];
        }
    }

    render();
}

// RESULTADO
function mostrarResultado(txt,cor){
    let el=document.getElementById("resultadoTela");
    el.className=cor;
    el.innerText=txt;
    el.style.display="flex";
    setTimeout(()=>el.style.display="none",3000);
}

// STATS
function atualizarStats(){
    document.getElementById("wins").innerText=wins;
    document.getElementById("loss").innerText=loss;
    let t=wins+loss;
    document.getElementById("assert").innerText=t?((wins/t)*100).toFixed(1)+"%":"0%";
}

// RENDER
function render(){
    const lista=historico.slice(-20);

    document.getElementById("historico").innerHTML=
        lista.map(r=>
            `<div class="bolinha ${r.cor==0?'b-branco':r.cor==1?'b-vermelho':'b-preto'}">${r.numero}</div>`
        ).join("");

    document.getElementById("sinais").innerHTML=
        sinais.map(par=>
            `<div class="sinal">⚪ ${par[0].hora} | ${par[1].hora}</div>`
        ).join("");
}
</script>

</body>
</html>
