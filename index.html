<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunter Branco AUTO PRO</title>

<style>
body { background:#020617; color:#fff; font-family:Arial; text-align:center; }

.container {
    width:100%;
    max-width:900px;
    margin:auto;
    padding:10px;
}

.card { background:#0f172a; margin:10px; padding:15px; border-radius:10px; }

.relogio { font-size:20px; font-weight:bold; color:#38bdf8; margin-top:10px; }

#historico {
    display:flex;
    overflow-x:auto;
}

.bolinha {
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; margin:3px; font-size:14px;
}

.b-vermelho { background:#ef4444; }
.b-preto { background:#111; }
.b-branco { background:#fff; color:#000; box-shadow:0 0 6px #fff; }

.sinal { background:#1e293b; margin:5px; padding:10px; border-radius:8px; }

.green { color:#22c55e; }
.red { color:#ef4444; }
</style>
</head>

<body>

<div class="container">

<h1>🤖 HUNTER BRANCO AUTO PRO</h1>
<div class="relogio" id="relogio">--:--:--</div>

<div class="card">
<h2>Histórico</h2>
<div id="historico"></div>
</div>

<div class="card">
<h2>Sinais</h2>
<div id="sinais"></div>
</div>

<div class="card">
<h2>Estatísticas</h2>
<div>Wins: <span id="wins">0</span></div>
<div>Loss: <span id="loss">0</span></div>
<div>Assertividade: <span id="assert">0%</span></div>
</div>

</div>

<script>

let historico = [];
let sinais = [];
let pedra1 = null;
let pedra2 = null;
let wins = 0;
let loss = 0;

// RELÓGIO
function atualizarRelogio() {
    const horaBR = new Date().toLocaleTimeString("pt-BR",{timeZone:"America/Sao_Paulo"});
    document.getElementById("relogio").innerText = horaBR;
}
setInterval(atualizarRelogio,1000);
atualizarRelogio();

// PROCESSAR RESULTADO
function processarResultadoBlaze(numero){
    let cor;
    if(numero === 0) cor = 0;
    else if(numero <= 7) cor = 1;
    else cor = 2;

    add(cor, numero);
}

// MARGEM
function dentroDaMargem(horarioSinal, agora){
    let [h,m] = horarioSinal.split(":").map(Number)
    let base = new Date(agora)
    base.setHours(h)
    base.setMinutes(m)
    base.setSeconds(0)

    let antes = new Date(base.getTime() - 60000)
    let depois = new Date(base.getTime() + 60000)

    return agora >= antes && agora <= depois
}

// ADD (sua lógica original)
function add(cor, numero) {

    const agora = new Date();
    const m = agora.getMinutes();
    const s = agora.getSeconds();

    historico.push({ cor, numero, hora: agora });
    if (historico.length > 100) historico.shift();

    // GREEN
    if(cor === 0 && sinais.length > 0){
        let ultimo = sinais[sinais.length - 1]

        if(!ultimo.resolvido){
            let bateu = ultimo.horarios.some(h => dentroDaMargem(h, agora))

            if(bateu){
                ultimo.resolvido = true
                ultimo.resultado = "green"
                wins++
                document.getElementById("wins").innerText = wins
            }
        }
    }

    const termino9 = (m % 10 === 9);
    const termino0 = (m % 10 === 0);

    if (cor !== 0 && termino9 && s >= 15 && s <= 45) {

        let base = new Date(agora);
        base.setSeconds(0);
        base.setMilliseconds(0);
        base.setMinutes(base.getMinutes() + 1);

        let alvo = new Date(base.getTime() + numero * 60000);

        pedra1 = { hora: alvo.toLocaleTimeString("pt-BR",{hour:'2-digit',minute:'2-digit'}), numero };
    }

    else if (cor !== 0 && ((termino9 && s > 45) || (termino0 && s <= 15))) {

        let base = new Date(agora);

        if (termino9) base.setMinutes(base.getMinutes() + 1);

        base.setSeconds(0);
        base.setMilliseconds(0);

        let alvo = new Date(base.getTime() + numero * 60000);

        pedra2 = { hora: alvo.toLocaleTimeString("pt-BR",{hour:'2-digit',minute:'2-digit'}), numero };
    }

    if (pedra1 || pedra2) {

        let lista = [];

        if (pedra1 && pedra1.numero !== 0) {
            lista.push({hora: pedra1.hora});
        }

        if (pedra2 && pedra2.numero !== 0) {
            if (!pedra1 || pedra1.numero !== pedra2.numero) {
                lista.push({hora: pedra2.hora});
            }
        }

        if (lista.length > 0) {
            sinais.push({
                horarios: lista.map(p => p.hora),
                resolvido: false,
                resultado: null
            });
        }

        pedra1 = null;
        pedra2 = null;
    }

    render();
}

// LOSS
setInterval(()=>{
    let agora = new Date()

    sinais.forEach(s => {
        if(s.resolvido) return

        let passou = s.horarios.every(h => {
            let [hh,mm] = h.split(":").map(Number)
            let base = new Date()
            base.setHours(hh)
            base.setMinutes(mm)
            base.setSeconds(0)

            let limite = new Date(base.getTime() + 60000)
            return agora > limite
        })

        if(passou){
            s.resolvido = true
            s.resultado = "loss"
            loss++
            document.getElementById("loss").innerText = loss
        }
    })

    atualizarAssertividade();

},1000)

// ASSERTIVIDADE
function atualizarAssertividade(){
    let total = wins + loss;
    let perc = total > 0 ? ((wins / total) * 100).toFixed(1) : 0;
    document.getElementById("assert").innerText = perc + "%";
}

// RENDER
function render(){
    const lista=historico.slice(-20);

    document.getElementById("historico").innerHTML=
        lista.map(r=>
            `<div class="bolinha ${r.cor==0?'b-branco':r.cor==1?'b-vermelho':'b-preto'}">${r.numero}</div>`
        ).join("");

    document.getElementById("sinais").innerHTML=
        sinais.map(par=>{
            let status = par.resolvido ? (par.resultado === "green" ? "✅" : "❌") : "";
            return `<div class="sinal">${status} ⚪ ${par.horarios.join(" | ")}</div>`;
        }).join("");
}

// 🔥 CONEXÃO DIRETA COM BLAZE (TEMPO REAL)
function conectarBlaze(){

    const socket = new WebSocket("wss://api-v2.blaze.com/roulette_games/realtime");

    socket.onopen = () => {
        console.log("Conectado na Blaze");
    };

    socket.onmessage = (event) => {
        try{
            const data = JSON.parse(event.data);

            if(data && data.roll !== undefined){
                processarResultadoBlaze(data.roll);
            }

        }catch(e){
            console.log("Erro ao ler dados", e);
        }
    };

    socket.onerror = (err) => {
        console.log("Erro socket", err);
    };

    socket.onclose = () => {
        console.log("Reconectando...");
        setTimeout(conectarBlaze, 3000);
    };
}

// INICIAR
conectarBlaze();

</script>

</body>
</html>
